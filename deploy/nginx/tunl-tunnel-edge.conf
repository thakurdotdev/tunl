# tunl tunnel edge: server-level guard for tunnel hosts.
# Install as /etc/nginx/snippets/tunl-tunnel-edge.conf and include it in the
# *.tunl.online and default_server (custom domain) blocks.

# Real visitor IP from Cloudflare, trusted only from Cloudflare's ranges.
include /etc/nginx/snippets/tunl-cloudflare-realip.conf;

# Drop connections that didn't come through Cloudflare.
if ($tunl_from_cloudflare = 0) {
    return 444;
}

# Coarse backstop; tunneld enforces the finer per-IP / per-tunnel limits
# and escalating bans.
limit_conn tunl_conn 200;
limit_req zone=tunl_req burst=1000 nodelay;
limit_conn_status 429;
limit_req_status 429;
limit_conn_log_level warn;
limit_req_log_level warn;

# Upper bound matches Cloudflare's 100 MB request cap; tunneld applies the
# per-tier limit (10 MB anonymous, 100 MB signed in).
client_max_body_size 100m;

# Slowloris: each read/write must make progress within these windows.
client_header_timeout 15s;
client_body_timeout 30s;
send_timeout 60s;
