# tunl tunnel edge: http-level pieces. Install as /etc/nginx/conf.d/tunl-edge.conf.
# Used by the *.tunl.online and custom-domain server blocks via
# snippets/tunl-tunnel-edge.conf.

# 1 when the TCP peer (before realip rewrites it) is a Cloudflare edge.
# Tunnel hosts are only served through Cloudflare, so anything else is someone
# hitting the origin IP directly to dodge Cloudflare or spoof CF-Connecting-IP.
geo $realip_remote_addr $tunl_from_cloudflare {
    default 0;
    include /etc/nginx/snippets/tunl-cloudflare-geo.conf;
}

# Keyed on the visitor's real IP (after realip).
limit_conn_zone $binary_remote_addr zone=tunl_conn:20m;
limit_req_zone  $binary_remote_addr zone=tunl_req:20m rate=200r/s;
