# tunl.online: static dashboard (`dashboard/out`) + control-plane API.
# The dashboard is a Next.js static export, so nginx serves the files directly;
# there is no Node process for it. A deploy is just `bun run build`; nginx picks
# up the new files without a reload.
#
# The *.tunl.online and custom-domain server blocks are omitted here. Each one
# includes the tunnel edge guard and proxy snippets from this directory:
#
#   server {
#       listen 443 ssl;
#       server_name *.tunl.online;      # or `_` + default_server for custom domains
#       ssl_certificate     /etc/ssl/tunnel/origin.pem;
#       ssl_certificate_key /etc/ssl/tunnel/origin-key.pem;
#       include /etc/nginx/snippets/tunl-tunnel-edge.conf;
#       location / {
#           include /etc/nginx/snippets/tunl-tunnel-proxy.conf;
#       }
#   }
#
# tunl-edge-http.conf goes in /etc/nginx/conf.d/; update-cloudflare-ips.sh
# writes the Cloudflare range snippets both of them use.

server {
    listen 443 ssl;
    server_name tunl.online;
    ssl_certificate /etc/letsencrypt/live/tunl.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunl.online/privkey.pem;

    client_max_body_size 16M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/manifest+json image/svg+xml text/x-component;

    root /opt/tunl/dashboard/out;
    error_page 404 /404.html;

    location /api {
        rewrite ^/api/(.*)$ /$1 break;
        rewrite ^/api$ / break;
        proxy_pass http://127.0.0.1:3091;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Old inspector URLs (/inspect/<sub>, /inspect/<sub>/analytics) from older
    # tunneld builds, bookmarks and shared links -> query-param routes.
    location ~ "^/inspect/(?!(?:requests|analytics)/?$)([a-z0-9-]{3,63})/analytics/?$" {
        return 301 /inspect/analytics?subdomain=$1;
    }
    location ~ "^/inspect/(?!(?:requests|analytics)/?$)([a-z0-9-]{3,63})/?$" {
        return 301 /inspect/requests?subdomain=$1;
    }

    # Hashed build assets never change.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Extensionless metadata files emitted by the export.
    location = /opengraph-image {
        default_type image/png;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location / {
        # One URL per page: /login/ -> /login (matches canonical + sitemap).
        rewrite ^/(.+)/$ /$1 permanent;

        # HTML and RSC payloads must revalidate so a deploy shows up at once.
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
    }
}

server {
    if ($host = tunl.online) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name tunl.online;
    return 404;
}
