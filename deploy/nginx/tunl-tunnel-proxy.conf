# tunl tunnel edge: proxy settings for the tunnel location blocks.
# Install as /etc/nginx/snippets/tunl-tunnel-proxy.conf.
proxy_pass http://127.0.0.1:8088;
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_set_header Host $host;
# $remote_addr is the real visitor here (realip). tunneld trusts X-Real-IP
# only from loopback; CF-Connecting-IP is overwritten so the local app can't
# be fed a forged value either.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header CF-Connecting-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Stream both ways: uploads go straight to tunneld (which enforces the body
# cap) and SSE / long downloads reach the visitor as they are produced.
proxy_request_buffering off;
proxy_buffering off;

# Long-lived WebSockets; tunneld closes them after 15 min of silence.
proxy_read_timeout 86400s;
proxy_send_timeout 86400s;
