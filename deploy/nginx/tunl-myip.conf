# myip.tunl.online: tells the dashboard the visitor's IP as tunnels see it.
# Install as /etc/nginx/conf.d/tunl-myip.conf (needs tunl-edge-http.conf and the
# tunnel edge snippet).
#
# tunl.online is DNS-only and IPv4-only, so the API there sees a browser's
# IPv4 address. Tunnel hosts go through Cloudflare, which is dual-stack, so the
# same browser usually reaches a tunnel over IPv6 and that is the address the
# IP allowlist checks. This host takes the tunnel path and answers with it.
# More specific than the *.tunl.online wildcard; "myip" is a reserved subdomain.
server {
    listen 443 ssl;
    server_name myip.tunl.online;
    ssl_certificate /etc/ssl/tunnel/origin.pem;
    ssl_certificate_key /etc/ssl/tunnel/origin-key.pem;

    # Same realip + Cloudflare-only guard as tunnels, so $remote_addr is the
    # visitor (CF-Connecting-IP) and can't be spoofed from outside Cloudflare.
    include /etc/nginx/snippets/tunl-tunnel-edge.conf;

    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "https://tunl.online" always;
    add_header Vary "Origin" always;

    location = / {
        return 200 '{"ip":"$remote_addr"}\n';
    }
    location / {
        return 404;
    }
}
