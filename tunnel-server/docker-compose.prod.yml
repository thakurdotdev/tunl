services:
  tunneld:
    build: .
    restart: unless-stopped
    ports:
      - "2222:2222"
      - "8080:8080"
      - "9090:9090"
    env_file: .env
    volumes:
      - ssh-host-key:/data/ssh

  nginx-setup:
    image: alpine:3.20
    restart: "no"
    pid: host
    volumes:
      - ./nginx-tunnel.conf:/src/tunnel.conf:ro
      - /etc/nginx/sites-enabled:/etc/nginx/sites-enabled
      - /etc/ssl/tunnel:/etc/ssl/tunnel
      - /run:/run:ro
    command: >-
      sh -c "cp /src/tunnel.conf /etc/nginx/sites-enabled/tunnel && kill -HUP $$(cat /run/nginx.pid 2>/dev/null) 2>/dev/null || true"

volumes:
  ssh-host-key:
