name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ─── CI: runs on every PR and push ───────────────────────────────────────────
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: tunnel-server/go.mod
          cache-dependency-path: tunnel-server/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check (TS/JS)
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Go format check
        run: pnpm run go:format:check

      - name: Go vet + tests
        run: pnpm run go:check

      - name: Build (validate compile)
        run: pnpm run build

  # ─── CD: deploy to server on push to main ────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/tunl

            echo "── pulling latest code ──"
            git pull origin main

            echo "── installing node dependencies ──"
            pnpm install --frozen-lockfile

            echo "── building control-plane ──"
            pnpm --filter control-plane build

            echo "── building dashboard ──"
            pnpm --filter dashboard build

            echo "── building tunnel-server ──"
            cd tunnel-server
            go build -o bin/tunneld ./cmd/tunneld
            cd ..

            echo "── running database migrations ──"
            pnpm run db:migrate

            echo "── running seeder ──"
            pnpm run db:seed

            echo "── reloading pm2 ──"
            pm2 reload ecosystem.config.js --update-env

            echo "── deploy complete ──"
