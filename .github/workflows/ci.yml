name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── CI: fast unified verification ───────────────────────────────────────────
  check:
    name: Check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: tunnel-server/go.mod
          cache-dependency-path: tunnel-server/go.sum

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/dashboard/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('dashboard/**/*.[jt]s*', 'dashboard/**/*.[jt]sx*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks & build in parallel
        run: |
          pnpm run format:check &
          pnpm run lint &
          pnpm run test &
          pnpm run go:format:check &
          pnpm run go:check &
          pnpm run build &
          wait

  # ─── CD: deploy to server on push to main ────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail
            export PNPM_HOME="$HOME/.local/share/pnpm"
            export PATH="$PNPM_HOME:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1 2>/dev/null)/bin:/usr/local/go/bin:$PATH"

            cd /opt/tunl

            echo "── pulling latest code ──"
            git pull origin main

            echo "── installing node dependencies ──"
            pnpm install --frozen-lockfile

            echo "── building services in parallel ──"
            pnpm run build

            echo "── running database migrations ──"
            pnpm run db:migrate

            echo "── running seeder ──"
            pnpm run db:seed

            echo "── reloading pm2 ──"
            pm2 reload ecosystem.config.js --update-env

            echo "── deploy complete ──"
