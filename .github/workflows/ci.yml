name: CI

on:
  pull_request:
    paths:
      - "control-plane/**"
      - "dashboard/**"
      - "tunnel-server/**"
      - "ecosystem.config.js"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "control-plane/**"
      - "dashboard/**"
      - "tunnel-server/**"
      - "ecosystem.config.js"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── CI: fast unified verification ───────────────────────────────────────────
  check:
    name: Check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tunnel-server/go.mod
          cache-dependency-path: tunnel-server/go.sum

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/dashboard/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('dashboard/**/*.[jt]s*', 'dashboard/**/*.[jt]sx*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks & build in parallel
        run: |
          bun run format:check &
          bun run lint &
          bun run test &
          bun run go:format:check &
          bun run go:check &
          bun run build &
          wait

