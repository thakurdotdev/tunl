services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tunnel
      POSTGRES_PASSWORD: tunnel
      POSTGRES_DB: tunnel_saas
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tunnel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  control-plane:
    build:
      context: ..
      dockerfile: control-plane/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CONTROL_PLANE_PORT:-3091}:3001"
    env_file:
      - path: ../control-plane/.env
        required: false
    environment:
      DATABASE_URL: postgres://tunnel:tunnel@postgres:5432/tunnel_saas
      REDIS_URL: redis://redis:6379/0
      DASHBOARD_URL: http://tunl.thakur.dev
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
      args:
        NEXT_PUBLIC_CONTROL_PLANE_URL: /api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3090}:3000"
    env_file:
      - path: ../dashboard/.env
        required: false
    environment:
      NEXT_PUBLIC_CONTROL_PLANE_URL: /api
      NODE_ENV: production
    depends_on:
      - control-plane

  tunnel-server:
    build:
      context: ../tunnel-server
    restart: unless-stopped
    env_file:
      - path: ../tunnel-server/.env
        required: false
    environment:
      CONTROL_PLANE_URL: http://control-plane:3001
    ports:
      - "2222:2222"
      - "127.0.0.1:${TUNNEL_HTTP_PORT:-8088}:8080"
      - "8443:8443"
      - "9090:9090"
    volumes:
      - ssh-keys:/data/ssh
    depends_on:
      - control-plane

  nginx-setup:
    image: alpine:3.20
    restart: "no"
    pid: host
    volumes:
      - ./nginx.conf:/src/tunl.conf:ro
      - /etc/nginx/sites-enabled:/etc/nginx/sites-enabled
      - /run:/run:ro
    command: >-
      sh -c "cp /src/tunl.conf /etc/nginx/sites-enabled/tunl && kill -HUP $$(cat /run/nginx.pid 2>/dev/null) 2>/dev/null || true"

volumes:
  postgres-data:
  redis-data:
  ssh-keys:
